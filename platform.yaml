# The application manifest — the one file that says what this repository
# contains and where its deployment state lives.
#
# CI reads it on every commit to work out which services a change affects and
# which GitOps repository to open a pull request against. Nothing else in
# .github/ is generated or application-specific, so adding a fifth service
# later is: create services/<name>/, add three lines here, and add the matching
# deployment state to the GitOps repository. The pipeline picks it up with no
# workflow change at all.
#
# Editing this file affects every service (it is listed under sharedPaths), so
# a change here deliberately rebuilds all of them.

application: checkout-platform
description: Demo application walking the platform golden path end to end
owner: bernadin-kabore

# Deployment state for every service in this application. CI opens its pull
# requests here and never writes to this repository.
gitopsRepository: checkout-platform-gitops

# The only environment a successful build advances automatically. Staging and
# production move by promotion pull request in the GitOps repository, so an
# image cannot reach them merely by existing in ECR.
autoDeployEnvironment: dev

# Note for anyone editing this file: it is listed in sharedPaths below, so any
# change here -- including a comment -- rebuilds every service in the
# application. That is deliberate (nothing in this file can be attributed to
# one service), but it means documentation edits are not free.

# A change to any of these rebuilds every service, because nothing here can be
# attributed to one of them. Correctness over cleverness: over-building costs a
# runner, under-building ships a stale image while reporting success.
sharedPaths:
  - platform.yaml
  - .github/workflows/*
  # shared/ does not exist yet. It is listed so that the first commit to
  # create it rebuilds every service, rather than the directory quietly
  # becoming a source of untracked coupling between them.
  - shared/*

services:
  - name: auth
    language: go
  - name: payments
    language: nodejs
